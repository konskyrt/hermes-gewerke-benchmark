# Source registry for the cross-schedule benchmark.
#
# `root` is resolved first against an absolute path, then against SCHEDULE_BENCHMARK_ROOT,
# so the folder can move without touching this file.
#
# Per source:
#   project      grouping key - schedules sharing a project land in one dashboard tab
#   reader       excel | csv_semicolon
#   parser       optional structural parser applied after the generic column map
#   columns      canonical field -> source column name
#   constants    canonical field -> fixed value for every row of this source
#   duration_unit  how the duration column reads: "mpp" (=> "23 dys?"), "days_int", "de_tage"

root: "C:/Users/KonstantinosKyrtsoni/OneDrive - ambergloglay.com/Documents/Master/all_Projects/classification_systems/schedule classification"

sources:
  - schedule_id: baeretower
    label: "Zentrum Bären / BäreTower"
    project: baeretower
    file: "BäreTower_Schedule.xlsx"
    reader: excel
    duration_unit: mpp
    columns:
      task_id: "Unique ID"
      task_name: "Vorgangsname"
      duration: "Duration"
      start: "Start"
      finish: "Finish"
      wbs: "WBS"
      wbs_level: "Outline Level"
      is_summary_raw: "Summary"
      is_milestone_raw: "Milestone"
      floor_raw: "Geschoss"
      building: "Gebäude"
      gewerk_raw: "Gewerk"
      crew_size: "Anzahl Personen"
      usage: "Nutzung"
      predecessors: "Predecessors"

  # Same content as BäreTower_Schedule.xlsx with the columns reordered. Kept in the
  # registry so ingest can assert that, and disabled so it is not counted twice.
