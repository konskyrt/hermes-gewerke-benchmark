    - { match: "kabel|verkabelung|\\blwl\\b|leitung|stromschiene|ableitung|erdungsleiter", code: EL.02 }
    - { match: "trasse|kabeltrag|kabelrinne|h(ä|ae)ngestiel|seilabh(ä|ae)ngung", code: EL.03 }
