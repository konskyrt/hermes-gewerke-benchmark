    - { match: "kanal|luftleitung|luftkan", code: LF.03 }
    - { match: "fitting|formteil", code: LF.04 }
    - { match: "klappe|armatur|volumenstrom", code: LF.05 }
    - { match: "schalld(ä|ae)mpfer", code: LF.06 }
    - { match: "auslass|durchlass|gitter|diffusor", code: LF.07 }
    - { match: "d(ä|ae)mmung|isolierung", code: LF.08 }
