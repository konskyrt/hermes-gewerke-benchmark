    - { match: "fitting|formst(ü|ue)ck", code: HZ.04 }
    - { match: "ventil|armatur|verteiler", code: HZ.05 }
    - { match: "speicher", code: HZ.06 }
    - { match: "z(ä|ae)hler|messger", code: HZ.07 }
    - { match: "heizk(ö|oe)rper|radiator|fussbodenheizung|w(ä|ae)rmeabgabe|konvektor|heating equipment", code: HZ.08 }
    - { match: "d(ä|ae)mmung|isolierung", code: HZ.09 }
    - { match: "halterung|aufh(ä|ae)ngung", code: HZ.10 }
  KT:
    - { match: "k(ä|ae)lteerzeuger|k(ä|ae)ltemaschine|chiller|outdoor unit|refrigeration equipment", code: KT.01 }
    - { match: "pumpe", code: KT.02 }
    - { match: "rohr|leitung|piping", code: KT.03 }
    - { match: "fitting", code: KT.04 }
    - { match: "ventil|armatur", code: KT.05 }
