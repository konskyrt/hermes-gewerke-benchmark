  GAS:
    - { match: "rohr|leitung", code: GAS.01 }
    - { match: "fitting", code: GAS.02 }
    - { match: "ventil|armatur", code: GAS.03 }
    - { match: "z(ä|ae)hler", code: GAS.04 }
    - { match: "verdichter|kompressor", code: GAS.05 }
    - { match: "halterung", code: GAS.06 }
  SPEC:
    - { match: "druckluft", code: SPEC.01 }
    - { match: "vakuumleitung", code: SPEC.02 }
    - { match: "fitting", code: SPEC.03 }
    - { match: "ventil|armatur", code: SPEC.04 }
    - { match: "medgas|entnahmestelle", code: SPEC.05 }
    - { match: "kontrolleinheit|(ü|ue)berwachung", code: SPEC.06 }
    - { match: "kompressor", code: SPEC.07 }
    - { match: "vakuumpumpe", code: SPEC.08 }
    - { match: "d(ä|ae)mmung|isolierung", code: SPEC.09 }
