# Component group -> level-2 codes of backend/scripts/data/label_object.json.
#
# The text searched is, in order: the parsed component group (pRED work package,
# DC30 material), then the task name. Rules are checked only against codes whose
# gewerk matches the task's gewerk, so "Rohr" resolves to SN.01 for a sanitary
# task and to HZ.03 for a heating one.
#
# `any` rules apply regardless of gewerk and run first.

any:
  - { match: "aufzug|lift\\b|fahrtreppe|rolltreppe", code: TRANS.01 }
  - { match: "rohrpost|materialtransport|f(ö|oe)rderanlage", code: TRANS.05 }

# Per-gewerk rules, ordered; first match wins within a gewerk.
by_gewerk:
  KO:
    - { match: "fundament|bodenplatte|pf(ä|ae)hl", code: KO.01 }
    - { match: "w(a|ä)nd|mauerwerk|schlitzwand|kern\\b", code: KO.02 }
    - { match: "st(ü|ue)tze|verbundst(ü|ue)tze", code: KO.03 }
    - { match: "tr(ä|ae)ger|unterzug|koppelbalken|balken", code: KO.04 }
    - { match: "decke|geschossdecke|betondecke", code: KO.05 }
    - { match: "treppe|rampe", code: KO.06 }
    - { match: "dachtragwerk|dachkonstruktion", code: KO.07 }
    - { match: "aussparung|sockel|durchbruch", code: KO.08 }
    - { match: "bewehrung|stahleinlage|armierung", code: KO.09 }
  ENV:
    - { match: "dach|bedachung|attika|flachdach|abdichtung", code: ENV.01 }
    - { match: "fassade|wdvs|fassadenputz|verkleidung aussen|stahlfassade", code: ENV.02 }
    - { match: "fenster|aussent(ü|ue)r|verglasung|holzfenster", code: ENV.03 }
    - { match: "sonnenschutz|storen|jalousie|lamelle", code: ENV.04 }
  INT:
    - { match: "trennwand|systemtrennw|glaswand|glastrennw|faltwand|elementwand|sanit(ä|ae)rtrennw", code: INT.01 }
    - { match: "trockenbau|gipskarton|st(ä|ae)nderwand|vorsatzschale", code: INT.02 }
    - { match: "t(ü|ue)r|zarge|schiebet(ü|ue)r|innenfenster|tor\\b", code: INT.03 }
    - { match: "maler|anstrich|tapezier|wandbel|wandbekleidung|putz|spachtel|kernverkleidung", code: INT.04 }
    - { match: "decke|k(ü|ue)hldecke|metalldecke|akustikdecke|brandschutzdecke|deckenbekleidung|lamellenk", code: INT.05 }
    - { match: "boden|doppelboden|hohlraumboden|unterlagsboden|estrich|teppich|parkett|naturstein|fliesen|platten|kautschuk|epoxy|beschichtung|hartbeton|linoleum|\\bpvc\\b", code: INT.06 }
    - { match: "brandschott|abschottung|schutzbauteil|prallschutz", code: INT.07 }
    - { match: "einbau|schreiner|m(ö|oe)bel|theke|nische|garderobenschrank|vorhang", code: INT.08 }
  SN:
    - { match: "rohr|leitung|fallleitung|steigleitung", code: SN.01 }
    - { match: "fitting|formst(ü|ue)ck", code: SN.02 }
    - { match: "ventil|armatur|absperr", code: SN.03 }
    - { match: "pumpe", code: SN.04 }
    - { match: "speicher|boiler|beh(ä|ae)lter", code: SN.05 }
    - { match: "apparat|nasszelle|wc|dusche|waschtisch|becken", code: SN.06 }
    - { match: "d(ä|ae)mmung|isolierung", code: SN.08 }
    - { match: "halterung|aufh(ä|ae)ngung|konsole", code: SN.09 }
  HZ:
    - { match: "kessel|w(ä|ae)rmeerzeuger|w(ä|ae)rmepumpe|heizzentrale", code: HZ.01 }
    - { match: "pumpe", code: HZ.02 }
